# weed-spray accurate SITL — Gazebo Harmonic + MediaMTX (opt-in).
# Default light path remains compose.yaml (SIH + file RTSP). See issue #19.
# Contract: bot_files/sitl_loop.md (gz bar); docs/acceptance.md SIH bar unchanged.
#
# Pin: px4io/px4-sitl-gazebo from https://docs.px4.io/main/en/simulation/px4_sitl_prebuilt_packages
# Model: gz_x500_lidar_down (PX4_SYS_AUTOSTART 4016) — downward 1D lidar only.
# Camera → rtsp://127.0.0.1:8554/cam is NOT wired yet (lidar_down has no stock cam;
#  overlay / bridge is a follow-up on #19). Do not use smoke.mp4 on this profile.
#
# WSL: network_mode host + host.docker.internal → 127.0.0.1 (same as SIH).
# HEADLESS=1 — no Gazebo GUI. One vehicle. Do not docker pull extras beyond this file.

services:
  px4:
    image: px4io/px4-sitl-gazebo:latest
    container_name: weed-spray-px4-gz
    network_mode: host
    environment:
      PX4_SIM_MODEL: gz_x500_lidar_down
      HEADLESS: "1"
      # Keep realtime; do not set PX4_SIM_SPEED_FACTOR.
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    stdin_open: true
    tty: true
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: weed-spray-mediamtx-gz
    network_mode: host
    volumes:
      - ./sitl/mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]
    restart: unless-stopped
