# weed-spray accurate SITL — Gazebo Harmonic + MediaMTX (opt-in).
# Default light path remains compose.yaml (SIH + file RTSP). See issue #19.
#
# Project name isolates this stack from SIH (shared host network / service labels).
name: weed-spray-gz
#
# Pin: px4io/px4-sitl-gazebo — https://docs.px4.io/main/en/simulation/px4_sitl_prebuilt_packages
# Model: gz_x500_lidar_down (4016) with repo overlay adding downward mono_cam.
# Camera: GstCameraSystem UDP RTP :5600 (H264 PT 96) → MediaMTX udp+rtp + rtpSDP
#   → rtsp://127.0.0.1:8554/cam (one GCS URL). No smoke.mp4. No bare ffmpeg rtp://.
# WSL: network_mode host + host.docker.internal → 127.0.0.1. HEADLESS=1.
# Do not docker pull extras beyond this file.

services:
  px4:
    image: px4io/px4-sitl-gazebo:latest
    container_name: weed-spray-px4-gz
    network_mode: host
    environment:
      PX4_SIM_MODEL: gz_x500_lidar_down
      HEADLESS: "1"
    volumes:
      - ./sitl/gz/models/x500_lidar_down:/opt/px4-gazebo/share/gz/models/x500_lidar_down:ro
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    stdin_open: true
    tty: true
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: weed-spray-mediamtx-gz
    network_mode: host
    volumes:
      - ./sitl/mediamtx-gazebo.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]
    restart: unless-stopped
