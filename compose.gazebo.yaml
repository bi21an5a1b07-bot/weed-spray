# weed-spray accurate SITL — Gazebo Harmonic + MediaMTX (opt-in).
# Default light path remains compose.yaml (SIH + file RTSP). See issue #19.
#
# Project name isolates this stack from SIH (shared host network / service labels).
name: weed-spray-gz
#
# Pin: px4io/px4-sitl-gazebo — https://docs.px4.io/main/en/simulation/px4_sitl_prebuilt_packages
# Model: gz_x500_lidar_down (4016) with repo overlay adding downward mono_cam.
# Camera path: GstCameraSystem UDP RTP :5600 → cam-bridge → rtsp://127.0.0.1:8554/cam
#   (one GCS URL; not a second dashboard path). No smoke.mp4.
# WSL: network_mode host + host.docker.internal → 127.0.0.1. HEADLESS=1.
# Do not docker pull extras beyond this file.

services:
  px4:
    image: px4io/px4-sitl-gazebo:latest
    container_name: weed-spray-px4-gz
    network_mode: host
    environment:
      PX4_SIM_MODEL: gz_x500_lidar_down
      HEADLESS: "1"
    # Overlay stock x500_lidar_down with lidar+cam merge (PX4-gazebo-models sourced).
    volumes:
      - ./sitl/gz/models/x500_lidar_down:/opt/px4-gazebo/share/gz/models/x500_lidar_down:ro
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    stdin_open: true
    tty: true
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: weed-spray-mediamtx-gz
    network_mode: host
    volumes:
      - ./sitl/mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]
    restart: unless-stopped

  # Republish Gazebo RTP :5600 into the single MediaMTX path the GCS already uses.
  cam-bridge:
    image: mwader/static-ffmpeg:7.1
    container_name: weed-spray-cam-bridge-gz
    network_mode: host
    depends_on:
      - mediamtx
      - px4
    restart: on-failure
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -fflags
      - nobuffer
      - -flags
      - low_delay
      - -i
      - rtp://127.0.0.1:5600?localport=5600
      - -c:v
      - copy
      - -an
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://127.0.0.1:8554/cam
