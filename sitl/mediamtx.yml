# MediaMTX: publisher path `cam`.
# RTSP 8554 for backend/YOLO. WebRTC 8889 for the dashboard (browsers cannot play RTSP).
logLevel: warn
rtspAddress: :8554
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
hlsVariant: lowLatency
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcTrustedProxies: ["127.0.0.1"]
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts: ["127.0.0.1"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
playback: no

paths:
  cam:
    source: publisher
