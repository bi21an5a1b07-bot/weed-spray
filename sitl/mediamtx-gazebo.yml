# MediaMTX for Gazebo profile (issue #19).
# PX4 GstCameraSystem publishes H264 RTP PT 96 to UDP :5600.
# Ingest via udp+rtp + rtpSDP (not bare ffmpeg rtp:// — needs SDP).
# Same path name `cam` → rtsp://127.0.0.1:8554/cam + HLS :8888.
logLevel: warn
rtspAddress: :8554
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
hlsVariant: lowLatency
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcTrustedProxies: ["127.0.0.1"]
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts: ["127.0.0.1"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
playback: no

paths:
  cam:
    source: udp+rtp://127.0.0.1:5600
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=PX4 GstCameraSystem H264
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5600 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1
