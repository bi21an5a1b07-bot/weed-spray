# Dev tools for weed-spray. https://mise.jdx.dev/walkthrough.html
# Install: mise trust && mise install
# Python packages stay in uv (pyproject.toml). npm packages stay in dashboard/.
# Docker is a host service, not a mise tool.

min_version = "2025.8.0"

[tools]
python = "3.11"
uv = "latest"
node = "26"

[settings]
python.uv_venv_auto = "source"

[env]
_.path = ["{{config_root}}/dashboard/node_modules/.bin"]

[tasks.install]
description = "Sync uv extras and dashboard npm (run after mise install)"
run = [
  "uv sync --extra dev",
  "npm --prefix dashboard install",
]

[tasks.check]
description = "Ruff + pytest (same as make check)"
run = "make check"

[tasks.accept]
description = "Live loop.md SITL grade (needs compose + apps)"
run = "make accept"

[tasks.bot-files]
description = "Show bot_files/ delta vs last snapshot (exit 1 if work pending)"
run = "uv run python scripts/bot_files_delta.py"
