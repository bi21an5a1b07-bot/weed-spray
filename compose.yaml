# weed-spray SITL — PX4 SIH + file RTSP only.
# Contract: bot_files/loop.md
# Host network so UDP 14540 lands on WSL. One vehicle.
# extra_hosts pins host.docker.internal to 127.0.0.1 so the image entrypoint
# does not send MAVLink to the Windows Docker Desktop IP.
# Do not add images beyond this file.

services:
  px4:
    image: px4io/px4-sitl:latest
    container_name: weed-spray-px4
    network_mode: host
    environment:
      PX4_SIM_MODEL: sihsim_quadx
    # px4-entrypoint.sh rewrites mavlink -t to host.docker.internal when that
    # name resolves (Docker Desktop). On this WSL host-network setup that IP is
    # the Windows host, so MAVSDK on 127.0.0.1:14540 never sees HEARTBEAT.
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    stdin_open: true
    tty: true
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: weed-spray-mediamtx
    network_mode: host
    volumes:
      - ./sitl/mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]
    restart: unless-stopped

  rtsp-pub:
    image: mwader/static-ffmpeg:7.1
    container_name: weed-spray-rtsp-pub
    network_mode: host
    depends_on:
      - mediamtx
    volumes:
      - ./media:/media:ro
    restart: on-failure
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /media/smoke.mp4
      - -an
      - -c:v
      - copy
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://127.0.0.1:8554/cam
